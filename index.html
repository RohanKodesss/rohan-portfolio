    />

    <meta name="theme-color" content="#EDE3D0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/ethnocentric-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      document.documentElement.classList.add("js");

      (function () {
        var theme = "light";

        try {
          var param = new URLSearchParams(window.location.search).get("theme");
          var saved = window.localStorage.getItem("rohan-theme");

          if (param === "dark" || param === "light") {
            theme = param;
          } else if (saved === "dark" || saved === "light") {
            theme = saved;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (error) {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        }

        document.documentElement.dataset.theme = theme;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#0D1615" : "#EDE3D0");
        }

        // Let the first paint finish before the paper texture is rasterized.
        var revealTexture = function () {
          document.documentElement.classList.add("is-textured");
        };

        if ("PerformanceObserver" in window) {
          try {
            var paintObserver = new PerformanceObserver(function (list) {
              var painted = list.getEntries().some(function (entry) {
                return entry.name === "first-contentful-paint";
              });
              if (painted) {
                paintObserver.disconnect();
                revealTexture();
              }
            });
            paintObserver.observe({ type: "paint", buffered: true });
          } catch (error) {
            window.addEventListener("load", revealTexture);
          }
        } else {
          window.addEventListener("load", revealTexture);
        }
      })();
    </script>
