<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rohan, developer in India</title>
    <meta
      name="description"
      content="Rohan builds AI products and small web tools end to end. Inkloom, RepoQuest, Lurkr, and a card weaver built into this page."
    />
    <meta name="author" content="Rohan" />
    <meta property="og:title" content="Rohan builds small tools" />
    <meta
      property="og:description"
      content="AI products and small web tools, built end to end. Inkloom, RepoQuest, Lurkr, and a card weaver built into this page."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#e8dcc6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/ethnocentric-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      document.documentElement.classList.add("js");

      (function () {
        var theme = "light";

        try {
          var param = new URLSearchParams(window.location.search).get("theme");
          var saved = window.localStorage.getItem("rohan-theme");

          if (param === "dark" || param === "light") {
            theme = param;
          } else if (saved === "dark" || saved === "light") {
            theme = saved;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (error) {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        }

        document.documentElement.dataset.theme = theme;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#171717" : "#e8dcc6");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 32px; font-family: system-ui, sans-serif; background: #e8dcc6; color: #1f3b2e">

          This page runs on React. Enable JavaScript to see the work, or write to
          <a href="mailto:rohan922007@gmail.com">rohan922007@gmail.com</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
